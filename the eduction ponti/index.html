<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Fee Register</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="site-config.js"></script>
    <script>
      /* If site-config.js did not load, use safe defaults so the login and fee screens still work. */
      if (typeof SITE === "undefined") window.SITE = { name: "Fee Register", tagline: "", subtitle: "", heroImages: [], facilities: [], team: [], batches: [], gallery: [], phone: "", whatsapp: "", address: "", hours: "", about: "⚠ site-config.js did not load. Upload it in the same folder as index.html, and check it for a typing mistake (a missing comma or quote)." };
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
      /* THEME COLOURS: change these few lines to recolour the whole site. */
      :root {
        --g: #5b4bd5; /* main colour: buttons, headings, header */
        --gd: #3f33a8; /* darker shade: hover, footer */
        --gl: #eeeaff; /* soft background boxes */
        --ink: #1c1b33; /* text */
        --mut: #6b6a88; /* grey text */
        --ln: #e2defa; /* borders */
        --bg: #f6f4ff; /* page background */
        --bad: #b3261e;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          15px/1.5 system-ui,
          sans-serif;
        background: var(--bg);
        color: var(--ink);
      }
      header {
        background: var(--g);
        color: #fff;
        padding: 12px 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        position: sticky;
        top: 0;
        z-index: 5;
      }
      header b {
        font-size: 17px;
      }
      nav {
        display: flex;
        gap: 4px;
        overflow-x: auto;
        background: #fff;
        border-bottom: 1px solid var(--ln);
        padding: 0 8px;
      }
      nav button {
        border: 0;
        background: none;
        padding: 12px;
        font: inherit;
        color: var(--mut);
        border-bottom: 3px solid transparent;
        white-space: nowrap;
      }
      nav button {
        flex: none;
      }
      nav button.nv:disabled {
        opacity: 0.25;
      }
      nav button.nv {
        font-size: 26px;
        line-height: 1;
        padding: 6px 18px;
        font-weight: 700;
        color: var(--g);
      }
      nav button.on {
        color: var(--g);
        border-color: var(--g);
        font-weight: 600;
      }
      main {
        max-width: 1000px;
        margin: 0 auto;
        padding: 16px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 10px;
        margin-bottom: 16px;
      }
      .card {
        background: #fff;
        border: 1px solid var(--ln);
        border-radius: 10px;
        padding: 14px;
      }
      .card small {
        color: var(--mut);
        display: block;
      }
      .card strong {
        font-size: 22px;
      }
      .box {
        background: #fff;
        border: 1px solid var(--ln);
        border-radius: 10px;
        padding: 14px;
        margin-bottom: 14px;
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        text-align: left;
        padding: 8px 6px;
        border-bottom: 1px solid var(--ln);
        white-space: nowrap;
      }
      th {
        color: var(--mut);
        font-weight: 600;
        font-size: 13px;
      }
      tr.row {
        cursor: pointer;
      }
      tr.row:hover {
        background: var(--gl);
      }
      input,
      select,
      textarea {
        font: inherit;
        padding: 9px;
        border: 1px solid var(--ln);
        border-radius: 8px;
        width: 100%;
        background: #fff;
      }
      label {
        display: block;
        font-size: 13px;
        color: var(--mut);
        margin: 8px 0 3px;
      }
      .btn {
        background: var(--g);
        color: #fff;
        border: 0;
        border-radius: 8px;
        padding: 9px 14px;
        font: inherit;
        cursor: pointer;
      }
      .btn:hover {
        background: var(--gd);
      }
      .btn.o {
        background: #fff;
        color: var(--g);
        border: 1px solid var(--g);
      }
      .btn.w {
        background: #25d366;
        color: #073;
      }
      .btn.r {
        background: var(--bad);
      }
      .row2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .bar {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin: 10px 0;
        align-items: end;
      }
      .bar > * {
        flex: 1;
        min-width: 130px;
      }
      .bar .btn {
        flex: none;
      }
      .chip {
        display: inline-block;
        padding: 2px 9px;
        border-radius: 12px;
        font-size: 12px;
        margin: 2px;
        background: var(--gl);
        color: var(--gd);
      }
      .chip.p {
        background: #fdecea;
        color: var(--bad);
      }
      dialog {
        border: 0;
        border-radius: 12px;
        max-width: 640px;
        width: 94%;
        padding: 18px;
      }
      dialog::backdrop {
        background: #0006;
      }
      #login {
        max-width: 360px;
        margin: 12vh auto;
        padding: 20px;
      }
      .err {
        color: var(--bad);
        min-height: 20px;
      }
      .hide {
        display: none;
      }
      @media (max-width: 520px) {
        .row2 {
          grid-template-columns: 1fr;
        }
      }

      /* ===== Public website (shown before login) ===== */
      html {
        scroll-behavior: smooth;
      }
      #site header {
        background: rgba(63, 51, 168, 0.94);
        backdrop-filter: blur(6px);
      }
      #site header a {
        color: #fff;
        text-decoration: none;
        margin-right: 14px;
      }
      .hero {
        min-height: 78vh;
        display: flex;
        align-items: flex-end;
        color: #fff;
        background: linear-gradient(135deg, #3f33a8, #5b4bd5) center/cover;
      }
      .hero > div {
        background: linear-gradient(0deg, rgba(28, 20, 88, 0.88), rgba(28, 20, 88, 0));
        width: 100%;
        padding: 90px 20px 40px;
      }
      .hero h1 {
        font:
          700 clamp(30px, 6vw, 56px)/1.1 Georgia,
          serif;
        margin: 0 0 10px;
        max-width: 760px;
      }
      .hero p {
        max-width: 560px;
        margin: 0 0 18px;
        font-size: 17px;
      }
      .wrap {
        max-width: 1000px;
        margin: 0 auto;
        padding: 0 16px;
      }
      .sec {
        padding: 44px 0;
      }
      .sec h2 {
        font:
          700 28px Georgia,
          serif;
        color: var(--gd);
        margin: 0 0 16px;
      }
      .facs {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 18px;
      }
      .facs div {
        border-top: 3px solid var(--g);
        padding-top: 8px;
      }
      .facs b {
        display: block;
      }
      .gal {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
        gap: 10px;
      }
      .gal img {
        width: 100%;
        height: 190px;
        object-fit: cover;
        border-radius: 8px;
      }
      .price {
        display: flex;
        justify-content: space-between;
        padding: 12px 0;
        border-bottom: 1px solid var(--ln);
        font-size: 17px;
      }
      .band {
        background: var(--gl);
      }
      footer {
        background: var(--gd);
        color: #dcd7ff;
        padding: 20px;
        text-align: center;
        font-size: 13px;
      }
      .btn.big {
        padding: 12px 20px;
        font-size: 16px;
        text-decoration: none;
        display: inline-block;
        margin: 0 8px 8px 0;
      }
      .hero {
        position: relative;
        overflow: hidden;
      }
      .hero > div {
        position: relative;
        z-index: 1;
      }
      .hero > span.bg {
        position: absolute;
        inset: 0;
        background: center/cover;
        opacity: 0;
        transition: opacity 1.2s;
      }
      .hero > span.bg.on {
        opacity: 1;
      }
      .team {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 20px;
        text-align: center;
      }
      .team img {
        width: 110px;
        height: 110px;
        border-radius: 50%;
        object-fit: cover;
        background: var(--gl);
        margin-bottom: 6px;
      }
      .team b {
        display: block;
      }
      .team span {
        color: var(--mut);
        font-size: 13px;
      }
      .batch {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
        padding: 12px 0;
        border-bottom: 1px solid var(--ln);
      }
      .batch span {
        color: var(--mut);
      }
      @media (max-width: 600px) {
        #site header a {
          display: none;
        }
      }
      /* Phones: show the WHOLE cover photo (no cropping), with the buttons below it. */
      @media (max-width: 700px) {
        .hero { min-height: 0; display: block; background: #2c2480; }
        .hero > span.bg { position: relative; inset: auto; display: none; opacity: 1; width: 100%;
          aspect-ratio: var(--ar, 16 / 9); background-size: contain; background-repeat: no-repeat; background-position: center; }
        .hero > span.bg.on { display: block; }
        .hero > div { background: none; padding: 18px 0 26px; }
      }
      #site { background: linear-gradient(180deg, #ece8ff 0%, #ffffff 45%); }
    </style>
  </head>
  <body>
    <!-- ===== PUBLIC WEBSITE: edit the SITE object in the script below ===== -->
    <div id="site">
      <header>
        <b id="sn1"></b>
        <span
          ><a href="#about">About</a><a href="#team">Team</a><a href="#batches">Batches</a
          ><a href="#fees">Fees</a><a href="#contact">Contact</a>
          <button class="btn o" id="loginBtn" style="background: #fff" onclick="showLogin()">
            Student / Staff login
          </button></span
        >
      </header>
      <section class="hero" id="hero">
        <div>
          <div class="wrap">
            <h1 id="st"></h1>
            <p id="ss"></p>
            <a class="btn big" id="scall">Call now</a
            ><a class="btn big w" id="swa" target="_blank">WhatsApp us</a>
          </div>
        </div>
      </section>
      <section class="sec" id="about">
        <div class="wrap">
          <h2>About us</h2>
          <p id="sa" style="max-width: 680px"></p>
          <div class="facs" id="sf"></div>
        </div>
      </section>
      <section class="sec band" id="team">
        <div class="wrap">
          <h2>Our team</h2>
          <div class="team" id="stm"></div>
        </div>
      </section>
      <section class="sec" id="batches">
        <div class="wrap">
          <h2>Batches</h2>
          <div id="sb" style="max-width: 640px"></div>
        </div>
      </section>
      <section class="sec band" id="gal">
        <div class="wrap">
          <h2>Take a look</h2>
          <div class="gal" id="sg"></div>
        </div>
      </section>
      <section class="sec" id="fees">
        <div class="wrap">
          <h2>Monthly fees</h2>
          <div id="sp" style="max-width: 520px"></div>
          <p><button class="btn" onclick="showLogin()">Already a member? Check your fees</button></p>
        </div>
      </section>
      <section class="sec band" id="contact">
        <div class="wrap">
          <h2>Visit us</h2>
          <p id="sc"></p>
        </div>
      </section>
      <footer id="sfoot"></footer>
    </div>
    <div id="login" class="box hide">
      <h2 style="color: var(--g); margin-top: 0" id="ln"></h2>
      <label>Mobile number</label><input id="m" inputmode="numeric" autocomplete="username" />
      <label>Password</label><input id="pw" type="password" autocomplete="current-password" />
      <p class="err" id="le"></p>
      <button class="btn" style="width: 100%" onclick="login()">Sign in</button>
      <p style="color: var(--mut); font-size: 13px">
        Forgot your password? Contact the library admin to reset it.
      </p>
      <p>
        <a
          href="#"
          onclick="
            showSite();
            return false;
          "
          >← Back to website</a
        >
      </p>
    </div>
    <div id="app" class="hide">
      <header>
        <b id="an"></b
        ><span
          ><span id="who"></span>
          <button class="btn o" style="padding: 4px 10px" onclick="pwChange()">Password</button>
          <button
            class="btn o"
            style="padding: 4px 10px"
            onclick="db.auth.signOut().then(() => location.reload())"
          >
            Sign out
          </button></span
        >
      </header>
      <nav id="nav"></nav>
      <main id="main"></main>
    </div>
    <dialog id="dlg"></dialog>
    <script>
      /* ===== CONFIG: paste your Supabase values here ===== */
      const SB_URL = "https://xvndvbkeqhwslqxdrfwf.supabase.co",
        SB_KEY = "sb_publishable_dwfroHvg0P4nqhqTg1Q3Cw_z_pWPqyT",
        LIB = SITE.name;
      const db = supabase.createClient(SB_URL, SB_KEY);

      /** Fill the public website from SITE (and fee plans from the database). */
      async function renderSite() {
        const set = (id, v) => ($(id).textContent = v);
        set("#sn1", LIB);
        set("#st", SITE.tagline);
        set("#ss", SITE.subtitle);
        set("#sa", SITE.about);

        startSlides();
        document.title = LIB;
        $("#scall").href = "tel:+91" + SITE.phone;
        $("#swa").href =
          "https://wa.me/91" +
          SITE.whatsapp +
          "?text=" +
          encodeURIComponent(SITE.websiteWhatsappText || "Hello, I want to know about admission.");
        $("#sf").innerHTML = SITE.facilities
          .map((f) => `<div><b>${esc(f[0])}</b>${esc(f[1])}</div>`)
          .join("");
        $("#sg").innerHTML = SITE.gallery
          .map((u) => `<img src="${esc(u)}" alt="" onerror="this.remove()">`)
          .join("");
        $("#gal").style.display = (SITE.gallery || []).length ? "" : "none"; // hide the section when there are no gallery photos
        $("#sc").innerHTML =
          `${esc(SITE.address)}<br>${esc(SITE.hours)}<br>Phone: <a href="tel:+91${esc(SITE.phone)}">${esc(SITE.phone)}</a><br><a href="https://www.google.com/maps/search/${encodeURIComponent(SITE.address)}" target="_blank">Open in Google Maps</a>`;
        $("#stm").innerHTML = (SITE.team || [])
          .map(
            (m) =>
              `<div><img src="${esc(m.photo)}" alt="" onerror="this.style.visibility='hidden'"><b>${esc(m.name)}</b><span>${esc(m.role)}</span></div>`,
          )
          .join("");
        $("#sb").innerHTML = (SITE.batches || [])
          .map(
            (b) =>
              `<div class="batch"><b>${esc(b.name)}</b><span>${esc(b.time)}</span><span>${esc(b.note || "")}</span></div>`,
          )
          .join("");
        set("#sfoot", "© " + new Date().getFullYear() + " " + LIB);
        const { data } = await db.from("plans").select("*").eq("active", true).order("id"); // needs the public-read policy in schema.sql
        $("#sp").innerHTML =
          (data || [])
            .map(
              (p) =>
                `<div class="price"><span>${esc(p.name)}</span><b>${inr(p.monthly_fee)} / month</b></div>`,
            )
            .join("") || "Contact us for current fees.";
      }
      /** Cross-fade the hero photos (SITE.heroImages). A missing photo simply shows the green background. */
      function startSlides() {
        const hero = $("#hero"),
          list = SITE.heroImages || [];
        const els = list.map((u) => {
          const e = document.createElement("span");
          e.className = "bg";
          e.style.backgroundImage = `url(${u})`;
          // Remember the photo's real shape so phones can show the whole picture (see the @media rule in the CSS).
          const im = new Image();
          im.onload = () => e.style.setProperty("--ar", im.naturalWidth + " / " + im.naturalHeight);
          im.src = u;
          hero.prepend(e);
          return e;
        });
        if (!els.length) return;
        let i = 0;
        els[0].classList.add("on");
        if (els.length > 1)
          setInterval(
            () => {
              els[i].classList.remove("on");
              i = (i + 1) % els.length;
              els[i].classList.add("on");
            },
            (SITE.slideSeconds || 4) * 1000,
          );
      }
      /** Home tab: show the public website. A signed-in user stays signed in and can return with "My dashboard". */
      function goHome() {
        if ($("#dlg").open) $("#dlg").close();
        $("#app").classList.add("hide");
        $("#site").classList.remove("hide");
        const b = $("#loginBtn");
        if (b) b.textContent = "My dashboard";
        scrollTo(0, 0);
      }
      function showLogin() {
        if (me) {
          // Already signed in: go straight back to the dashboard instead of the login box.
          $("#site").classList.add("hide");
          $("#app").classList.remove("hide");
          return;
        }
        $("#site").classList.add("hide");
        $("#login").classList.remove("hide");
        scrollTo(0, 0);
      }
      function showSite() {
        $("#login").classList.add("hide");
        $("#site").classList.remove("hide");
      }
      /** Download everything (students, payments, month totals) as one Excel file. */
      function exportExcel() {
        const day = 864e5,
          days = (d) => Math.floor((Date.now() - new Date(d + "T00:00")) / day),
          sn = (id) => S.find((x) => x.id === id);
        const students = S.map((s) => {
          const f = fee(s);
          return {
            "Student ID": s.code,
            Name: s.name,
            Mobile: s.mobile,
            "Parent mobile": s.parent_mobile || "",
            Address: s.address || "",
            Plan: s.plan_name,
            "Monthly fee": s.monthly_fee,
            "Joining date": s.join_date,
            "Leaving date": s.leave_date || "",
            Status: s.active ? "Active" : "Inactive",
            "Days since joining": days(s.join_date),
            "Total fees due": f.due,
            "Total paid": f.paid,
            Remaining: f.rem,
            "Paid months": f.pm,
            "Pending months": f.pend,
            "Fee valid until": f.until || "",
            "Last payment date": f.last || "",
            "Days since last payment": f.last ? days(f.last) : "",
          };
        });
        const payments = P.map((p) => ({
          Date: p.paid_on,
          "Transaction ID": p.txn_id,
          "Student ID": sn(p.student_id)?.code,
          Student: sn(p.student_id)?.name,
          Amount: +p.amount,
          Mode: p.mode.toUpperCase(),
          "Months covered": +p.months,
          "Valid until": p.valid_until,
          "Received by": p.received_name || "",
          Notes: p.notes || "",
        }));
        const by = {};
        P.forEach((p) => {
          const m = p.paid_on.slice(0, 7);
          by[m] ??= { Month: m, Payments: 0, Cash: 0, UPI: 0, Total: 0 };
          by[m].Payments++;
          by[m][p.mode === "cash" ? "Cash" : "UPI"] += +p.amount;
          by[m].Total += +p.amount;
        });
        const wb = XLSX.utils.book_new();
        [
          ["Students", students],
          ["Payments", payments],
          ["Monthly totals", Object.values(by).sort((a, b) => b.Month.localeCompare(a.Month))],
        ].forEach(([n, rows]) => XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), n));
        XLSX.writeFile(wb, "fee-data-" + today() + ".xlsx");
      }
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
        );
      const inr = (n) => "₹" + Number(n || 0).toLocaleString("en-IN"),
        $ = (s) => document.querySelector(s);
      const iso = (d) => new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10),
        today = () => iso(new Date());
      const fd = (d) =>
        d
          ? new Date(d + "T00:00").toLocaleDateString("en-GB", {
              day: "numeric",
              month: "long",
              year: "numeric",
            })
          : "—";
      /** Add (possibly fractional) months to a YYYY-MM-DD date. Used for the 'fee valid until' date. */
      function addM(s, m) {
        const d = new Date(s + "T00:00"),
          w = Math.floor(m),
          day = d.getDate();
        d.setMonth(d.getMonth() + w);
        if (d.getDate() !== day) d.setDate(0);
        d.setDate(d.getDate() + Math.round((m - w) * 30));
        return iso(d);
      }
      const T = (r) =>
        r
          .map(
            (x) =>
              `<tr${x.on ? ` class="row" onclick="${x.on}"` : ""}>${x.c.map((c) => `<td>${c}</td>`).join("")}</tr>`,
          )
          .join("");
      const tbl = (h, r) =>
        `<table><tr>${h.map((x) => `<th>${x}</th>`).join("")}</tr>${T(r) || `<tr><td colspan="${h.length}" style="color:var(--mut)">Nothing here yet.</td></tr>`}</table>`;
      let me,
        S = [],
        P = [],
        PL = [],
        tab = "dash";
      $("#ln").textContent = LIB;
      renderSite();
      $("#an").textContent = LIB;
      const can = (k) => me.role === "admin" || (me.role === "staff" && me.perms?.[k]);
      async function login() {
        $("#le").textContent = "";
        const m = $("#m").value.replace(/\D/g, "");
        const { error } = await db.auth.signInWithPassword({
          email: m + "@fees.local",
          password: $("#pw").value,
        });
        // Show the real reason so problems are easy to find (also printed in the browser console).
        if (error) {
          console.error("Login error:", error);
          $("#le").textContent = error.message === "Invalid login credentials"
            ? "Wrong mobile number or password. Forgot your password? Please contact the admin."
            : "Login problem: " + error.message;
        } else await boot(true);
      }
      /** Runs on page load: restore session, load the user's profile and build the screen for their role. */
      async function boot(fromLogin) {
        const {
          data: { session },
        } = await db.auth.getSession();
        if (!session) return;
        const { data } = await db.from("profiles").select("*").eq("id", session.user.id).single();

      // ---- fee maths ----
      /** Work out dues for one student: total paid, remaining, paid/pending months, fee-valid-until date. */
      function fee(s) {
        const pays = P.filter((p) => p.student_id === s.id),
          paid = pays.reduce((a, p) => a + +p.amount, 0),
          now = new Date(),
          end = s.leave_date && new Date(s.leave_date) < now ? new Date(s.leave_date) : now,
          j = new Date(s.join_date + "T00:00");
        const n = Math.max(1, (end.getFullYear() - j.getFullYear()) * 12 + end.getMonth() - j.getMonth() + 1),
          due = n * s.monthly_fee,
          pm = Math.min(n, Math.floor(paid / s.monthly_fee));
        const until = pays.reduce((a, p) => (p.valid_until > a ? p.valid_until : a), "");
        const names = [...Array(n)].map((_, i) => {
          const d = new Date(j.getFullYear(), j.getMonth() + i, 1);
          return d.toLocaleDateString("en-GB", { month: "short", year: "numeric" });
        });
        return {
          pays,
          paid,
          due,
          rem: Math.max(0, due - paid),
          pm,
          pend: n - pm,
          until,
          names,
          last: pays[0]?.paid_on,
        };
      }

 ${card("Collected this month", inr(sum(mp)))}${card("Cash", inr(sum(mp.filter((p) => p.mode === "cash"))))}${card("UPI", inr(sum(mp.filter((p) => p.mode === "upi"))))}${card("Total pending", inr(pend.reduce((a, x) => a + x.f.rem, 0)))}${card("Students with dues", pend.length)}</div>
 <div class="box"><h3>Fee expiring within 7 days or already expired</h3>${tbl(

 )}</div>`;

 <div class="bar">${can("record_payments") ? `<button class="btn" onclick="payForm('${id}')">Record payment</button>` : ""}<button class="btn w" onclick="wa('${id}','remind')">WhatsApp</button>

        const a = document.createElement("a");
        a.href = URL.createObjectURL(
          new Blob([k.join(",") + "\n" + rows.map((r) => k.map((c) => q(r[c])).join(",")).join("\n")], {
            type: "text/csv",
          }),
        );
        a.download = name + ".csv";
        a.click();
      }
      function pdfRows(title, rows) {
        const { jsPDF } = window.jspdf,
          d = new jsPDF();
        d.setFontSize(14);
        d.text(LIB + " - " + title, 10, 14);
        d.setFontSize(9);
        rows.forEach((r, i) => {
          const y = 24 + (i % 40) * 6.5;
          if (i && i % 40 === 0) d.addPage();
          d.text(Object.values(r).join("   "), 10, y);
        });
        d.save(title + ".pdf");
      }
      function rep() {
        const y = today().slice(0, 4);
        $("#main").innerHTML =
          `<div class="box"><div class="bar"><div><label>From</label><input id="f" type="date" value="${y}-01-01"></div><div><label>To</label><input id="t" type="date" value="${today()}"></div>
 <div><label>Report</label><select id="k"><option value="all">Collection (all)</option><option value="cash">Cash collection</option><option value="upi">UPI collection</option><option value="pend">Pending fees</option></select></div></div>
 <div class="bar"><button class="btn" onclick="run()">Show</button><button class="btn o" onclick="run('csv')">CSV</button><button class="btn o" onclick="run('pdf')">PDF</button><button class="btn" onclick="exportExcel()">Excel: all data</button></div><p><small style="color:var(--mut)">Tip: set From/To to one day, one month or one year for daily, monthly or yearly reports.</small></p><div id="out"></div></div>`;
      }
      /** Build the selected report on screen, or export it as CSV/PDF. */
      function run(x) {
        const k = $("#k").value,
          f = $("#f").value,
          t = $("#t").value;
        let rows;
        if (k === "pend")
          rows = S.filter((s) => s.active)
            .map((s) => ({
              ID: s.code,
              Name: s.name,
              Mobile: s.mobile,
              Pending_months: fee(s).pend,
              Due: fee(s).rem,
            }))
            .filter((r) => r.Due > 0);
        else
          rows = P.filter((p) => p.paid_on >= f && p.paid_on <= t && (k === "all" || p.mode === k)).map(
            (p) => {
              const s = S.find((z) => z.id === p.student_id);
              return {
                Date: p.paid_on,
                Txn: p.txn_id,
                ID: s?.code,
                Name: s?.name,
                Amount: p.amount,
                Mode: p.mode,
                Months: p.months,
                ReceivedBy: p.received_name,
              };
            },
          );
        const tot = rows.reduce((a, r) => a + +(r.Amount || r.Due || 0), 0);
        if (x === "csv") return csv("report-" + k, rows);
        if (x === "pdf") return pdfRows("report-" + k, rows);
        $("#out").innerHTML =
          `<p><b>${rows.length}</b> records · <b>${inr(tot)}</b></p>` +
          (rows.length
            ? tbl(
                Object.keys(rows[0]),
                rows.map((r) => ({ c: Object.values(r).map(esc) })),
              )
            : "<p>No records.</p>");
      }
      // ---- admin: plans & staff ----
      function plans() {
        if (me.role !== "admin") return;
        $("#main").innerHTML =
          `<div class="box"><h3>Fee plans</h3><p style="color:var(--mut)">Changing a fee here never changes past payments or existing students' fees.</p>${tbl(
            ["Plan", "Monthly fee", "Active", ""],
            PL.map((p) => ({
              c: [
                esc(p.name),
                inr(p.monthly_fee),
                p.active ? "Yes" : "No",
                `<button class="btn o" style="padding:3px 8px" onclick="editPlan(${p.id})">Edit</button>`,
              ],
            })),
          )}
 <div class="bar"><input id="pn" placeholder="New plan name"><input id="pf" type="number" placeholder="Monthly fee"><button class="btn" onclick="addPlan()">Add plan</button></div></div>`;
      }
      async function addPlan() {
        const { error } = await db
          .from("plans")
          .insert({ name: $("#pn").value.trim(), monthly_fee: +$("#pf").value });
        if (error) return alert(error.message);
        await load();
        plans();
      }
      async function editPlan(id) {
        if (me.role !== "admin") return;
        const p = PL.find((x) => x.id === id),
          v = prompt("New monthly fee for " + p.name, p.monthly_fee);
        if (v === null) return;
        await db.from("plans").update({ monthly_fee: +v }).eq("id", id);
        await load();
        plans();
      }
      async function staff() {
        if (me.role !== "admin") return;
        const { data } = await db.from("profiles").select("*").eq("role", "staff"),
          K = [
            ["add_students", "Add students"],
            ["view_students", "View students"],
            ["record_payments", "Record payments"],
            ["view_reports", "Reports"],
          ];
        window.ST = data || [];
        $("#main").innerHTML = `<div class="box"><h3>Staff</h3>${tbl(
          ["Name", "Mobile", ...K.map((k) => k[1]), ""],
          ST.map((u) => ({
            c: [
              esc(u.name),
              u.mobile,
              ...K.map(
                (k) =>
                  `<input type="checkbox" style="width:auto" ${u.perms?.[k[0]] ? "checked" : ""} onchange="perm('${u.id}','${k[0]}',this.checked)">`,
              ),
              `<button class="btn o" style="padding:3px 8px" onclick="resetPw('${u.id}')">Reset password</button>`,
            ],
          })),
        )}
 <h4>Add staff</h4><div class="bar"><input id="staffName" placeholder="Name"><input id="staffMobile" placeholder="Mobile" maxlength="10"><input id="staffPass" placeholder="Password"><button class="btn" onclick="addStaff()">Add</button></div></div>`;
      }
      async function perm(id, k, v) {
        const u = ST.find((x) => x.id === id);
        u.perms = { ...u.perms, [k]: v };
        await db.from("profiles").update({ perms: u.perms }).eq("id", id);
      }
      async function addStaff() {
        const r = await fn({
          action: "create_staff",
          name: $("#staffName").value,
          mobile: $("#staffMobile").value,
          password: $("#staffPass").value,
        });
        if (!r.ok) return alert(r.msg);
        staff();
      }
      $("#pw").addEventListener("keydown", (e) => e.key === "Enter" && login());
      boot();
    </script>
  </body>
</html>
